# ============================================================
# NexoGestao — Docker Compose PRODUÇÃO
# ============================================================
# Serviços: api, web, postgres, redis, nginx
# Uso:
#   cp .env.prod.example .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# ============================================================

services:

  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:?POSTGRES_USER obrigatório}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatório}
      POSTGRES_DB:       ${POSTGRES_DB:?POSTGRES_DB obrigatório}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER obrigatório} -d ${POSTGRES_DB:?POSTGRES_DB obrigatório}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nexo_internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD obrigatório}", "--appendonly", "yes"]
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD obrigatório}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexo_internal
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ─── API (NestJS) ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.prod
      args:
        NODE_ENV: production
    restart: unless-stopped
    env_file:
      - ${NEXO_ENV_FILE:-.env.prod}
    environment:
      NODE_ENV:     production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL obrigatório; use credenciais percent-encoded}
      REDIS_URL: ${REDIS_URL:?REDIS_URL obrigatório; use credenciais percent-encoded}
      API_PORT: "3000"
      AUTO_MIGRATE: "0"
      SEED_MODE: ""
      REQUIRE_DATABASE_SMOKE: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - nexo_internal
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Web (Frontend) ────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.prod
      args:
        NODE_ENV: production
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL obrigatório}
    restart: unless-stopped
    env_file:
      - ${NEXO_ENV_FILE:-.env.prod}
    environment:
      NODE_ENV: production
      WEB_PORT: "3010"
      NEXO_API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3010"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - nexo_internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Nginx (Reverse Proxy + HTTPS) ─────────────────────────
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN obrigatório}
      NGINX_ENVSUBST_FILTER: "^DOMAIN$"
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ${TLS_CERT_DIR:?TLS_CERT_DIR obrigatório}:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - nexo_internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Certbot (Let's Encrypt — renovação automática) ────────
  certbot:
    profiles: ["certificates"]
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # Renovação automática a cada 12h
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - nexo_internal

  # Explicit one-shot migration; never started by ordinary compose up.
  migrate:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.prod
      target: builder
    env_file:
      - ${NEXO_ENV_FILE:-.env.prod}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL obrigatório}
    command: ["pnpm", "--filter", "./apps/api", "exec", "prisma", "migrate", "deploy", "--schema", "../../prisma/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [nexo_internal]

volumes:
  pgdata_prod:
  redisdata_prod:
  nginx_logs:
  certbot_www:
  certbot_conf:

networks:
  nexo_internal:
    driver: bridge
