name: Production Compose validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-compose:
    name: disposable-${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [compose, railway]
    env:
      NEXO_DOCKER_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build, migrate and smoke isolated local Compose (no publication)
        run: bash scripts/smoke-production-compose.sh
