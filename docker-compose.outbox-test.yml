services:
  postgres-outbox-test:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexogestao_outbox_test
    ports:
      - "127.0.0.1:${OUTBOX_TEST_POSTGRES_PORT:-0}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexogestao_outbox_test"]
      interval: 1s
      timeout: 3s
      retries: 30
